<!DOCTYPE HTML>
<html>

<head>
    <title>Майоров Юрий - Fullstack Разработчик, Data Scientist</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="shortcut icon" type="image/x-icon" href="https://mayorovyuri.eu/favicon.ico">
    <style>
        @import url("https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,300italic,600,600italic");

        body {
            background: #242943;
            color: #ffffff;
            font-family: "Source Sans Pro", Helvetica, sans-serif;
            font-size: 17pt;
            font-weight: 300;
            letter-spacing: 0.025em;
            line-height: 1.65;
        }

        div {
            margin: 0 auto;
            max-width: 800px;
            padding: 4em 1em;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 600;
            margin: 0 0 1em 0;
        }

        p {
            margin: 0 0 2em 0;
        }

        a {
            color: #ffffff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .button {
            background: #ffffff;
            border-radius: 4px;
            color: #242943;
            display: inline-block;
            font-weight: 600;
            padding: 0.75em 1.5em;
            text-decoration: none;
            text-transform: uppercase;
        }

        .button.next {
            background: #ffffff;
            color: #242943;
        }

        .button.next:hover {
            background: #f9f9f9;
        }

        .button.next:active {
            background: #e9e9e9;
        }
    </style>
</head>
